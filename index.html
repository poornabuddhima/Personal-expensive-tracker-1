<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Personal Expense Tracker</span>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Financial Dashboard</h2>
        <p class="text-muted">Manage your income and expenses in one place.</p>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-success">Total Income</h5>
                        <h3 id="totalIncome">LKR 0.00</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-danger">Total Expenses</h5>
                        <h3 id="totalExpenses">LKR 0.00</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-primary">Current Balance</h5>
                        <h3 id="currentBalance">LKR 0.00</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">Add a Transaction</div>
            <div class="card-body">
                <form id="transactionForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Transaction Type</label>
                            <select id="type" class="form-select" required>
                                <option value="Income">Income</option>
                                <option value="Expense">Expense</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Description</label>
                            <input type="text" id="description" class="form-control" placeholder="e.g. Monthly allowance" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Amount (LKR)</label>
                            <input type="number" id="amount" class="form-control" placeholder="Enter amount" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Category</label>
                            <select id="category" class="form-select" required>
                                <option value="Allowance">Allowance</option>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Salary">Salary</option>
                                <option value="Education">Education</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Bills">Bills</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Transaction Date</label>
                            <input type="date" id="date" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary me-2">Add Transaction</button>
                            <button type="reset" class="btn btn-outline-secondary">Clear Form</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Transaction History</span>
                <div>
                    <label class="me-2">Filter by Type:</label>
                    <select id="filterType" class="form-select form-select-sm d-inline-block w-auto">
                        <option value="All">All Transactions</option>
                        <option value="Income">Income Only</option>
                        <option value="Expense">Expense Only</option>
                    </select>
                </div>
            </div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Type</th>
                            <th>Category</th>
                            <th>Amount (LKR)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTableBody">
                    </tbody>
                </table>
                <p id="noTransactions" class="text-center text-muted">No transactions found.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
